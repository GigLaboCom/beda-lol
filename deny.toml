# cargo-deny: licenses, advisories, bans, sources. Run `cargo deny check`.

[graph]
all-features = false

[advisories]
# RustSec advisory database; unmaintained crates reported for the workspace only.
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licenses only. Each entry is needed by the current tree:
#   MIT, Apache-2.0 — most crates; Apache-2.0 WITH LLVM-exception — wasi/rustix family;
#   Unicode-3.0 — ICU crates behind url/idna; BSD-3-Clause — subtle and others;
#   ISC — ring/rustls-webpki; Zlib — foldhash; CDLA-Permissive-2.0 — webpki-roots;
#   MPL-2.0 — reserved for future use (file-level copyleft only).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
