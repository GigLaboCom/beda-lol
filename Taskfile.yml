# Single entry point for common commands across the TypeScript (pnpm + Nx)
# and Rust (Cargo) halves of the monorepo. See CLAUDE.md → Commands.
version: '3'

vars:
  # Dev-only password for the `beda_api` role on the LOCAL Supabase database.
  DEV_API_PASSWORD: beda_api_dev
  # Superuser URL of the local Supabase database, read from the CLI (ports are not hardcoded).
  # Override with LOCAL_DB_URL=... when the database runs elsewhere.
  LOCAL_DB_URL:
    sh: '[ -n "$LOCAL_DB_URL" ] && echo "$LOCAL_DB_URL" || (supabase status -o env 2>/dev/null | sed -n "s/^DB_URL=\"\(.*\)\"$/\1/p")'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install JS dependencies (frozen lockfile)
    cmds:
      - pnpm install --frozen-lockfile

  dev:
    desc: Dev stack — Supabase, Rust API with reload, Astro dev server
    cmds:
      - supabase start
      - task: db:dev-role
      # Nx runs every project's continuous `dev` target in parallel (api, web).
      - BEDA_DATABASE_URL="$(task db:api-url)" pnpm exec nx run-many -t dev --outputStyle=stream

  web:dev:
    desc: Astro dev server on :4321 (proxies /api to :8080)
    cmds:
      - pnpm exec nx run web:dev --outputStyle=stream

  api:dev:
    desc: Rust API with reload on :8080 (needs watchexec and a running database)
    cmds:
      - BEDA_DATABASE_URL="${BEDA_DATABASE_URL:-$(task db:api-url)}" watchexec -r -e rs,toml -- cargo run -p beda-api -- serve

  db:url:
    desc: Print the local database URL (superuser)
    silent: true
    cmds:
      - echo '{{.LOCAL_DB_URL}}'

  db:api-url:
    desc: Print the local database URL for the beda_api role
    silent: true
    cmds:
      - echo '{{.LOCAL_DB_URL}}' | sed 's#//[^@]*@#//beda_api:{{.DEV_API_PASSWORD}}@#'

  db:dev-role:
    desc: Give the beda_api role a dev-only password on the local database
    cmds:
      - psql '{{.LOCAL_DB_URL}}' -v ON_ERROR_STOP=1 -q -c "alter role beda_api password '{{.DEV_API_PASSWORD}}'"

  db:reset:
    desc: Re-apply migrations and seed on the local Supabase database
    cmds:
      - supabase db reset
      - task: db:dev-role

  migrate:new:
    desc: 'New Supabase migration: task migrate:new -- <name>'
    cmds:
      - supabase migration new {{.CLI_ARGS}}

  gen:
    desc: Regenerate committed artefacts (sqlx offline data; needs the local database)
    cmds:
      - DATABASE_URL='{{.LOCAL_DB_URL}}' cargo sqlx prepare --workspace

  gen:check:
    desc: Fail if committed generated artefacts are stale (needs the local database)
    cmds:
      - DATABASE_URL='{{.LOCAL_DB_URL}}' cargo sqlx prepare --workspace --check

  fmt:
    desc: Format everything (Biome; nightly rustfmt — rustfmt.toml uses nightly-only options)
    cmds:
      - pnpm exec biome check --write .
      - cargo +nightly fmt --all

  lint:
    desc: Lint and format check (Biome for TS/JSON/CSS, nightly rustfmt + clippy for Rust)
    cmds:
      - pnpm exec biome check .
      - cargo +nightly fmt --all -- --check
      - cargo clippy --workspace --all-targets -- -D warnings

  gate:
    desc: 'Rust quality gate before every push (as in mnemoria-server): fmt, clippy on fresh roots, tests'
    cmds:
      - cargo +nightly fmt --all -- --check
      # A warm cache hides lints: touch the crate roots so clippy re-evaluates them.
      - touch apps/api/src/lib.rs apps/api/src/main.rs
      - cargo clippy --workspace --all-targets -- -D warnings
      - BEDA_TEST_DATABASE_URL='{{.LOCAL_DB_URL}}' cargo test --workspace

  hooks:
    desc: Install the git pre-push hook (nightly rustfmt + Biome check)
    cmds:
      - git config core.hooksPath .githooks
      - echo "pre-push hook installed (.githooks/pre-push)"

  typecheck:
    desc: Typecheck every TS project through Nx
    cmds:
      - pnpm exec nx run-many -t typecheck --outputStyle=static

  test:
    desc: Unit tests of every Nx project, including the Rust API (DB tests use the local database)
    cmds:
      - BEDA_TEST_DATABASE_URL='{{.LOCAL_DB_URL}}' pnpm exec nx run-many -t test --outputStyle=static

  build:
    desc: Build every TS project through Nx (web → dist/, server entry dist/server/entry.mjs)
    cmds:
      - pnpm exec nx run-many -t build --exclude=api --outputStyle=static

  prod:build:
    desc: Build both production images tagged `local`
    vars:
      RUST_IMAGE: '{{.RUST_IMAGE | default "rust:1.94.1-alpine3.23"}}'
      NODE_IMAGE: '{{.NODE_IMAGE | default "node:24.21.0-alpine3.24"}}'
      ALPINE_IMAGE: '{{.ALPINE_IMAGE | default "alpine:3.23"}}'
    cmds:
      - docker build -f apps/api/Dockerfile --build-arg RUST_IMAGE={{.RUST_IMAGE}} --build-arg BEDA_BUILD_SHA=$(git rev-parse HEAD) -t ghcr.io/giglabocom/beda-api:local .
      - docker build -f apps/web/Dockerfile --build-arg NODE_IMAGE={{.NODE_IMAGE}} --build-arg BEDA_BASE_URL=https://localhost -t ghcr.io/giglabocom/beda-web:local .
      - docker build -f deploy/backup/Dockerfile --build-arg ALPINE_IMAGE={{.ALPINE_IMAGE}} -t ghcr.io/giglabocom/beda-backup:local .

  prod:up:
    desc: Run the production stack locally on https://localhost against the local Supabase
    cmds:
      - mkdir -p tmp
      - |
        {
          echo "BEDA_ENV=prod"
          echo "BEDA_BASE_URL=https://localhost"
          echo "BEDA_DATABASE_URL=$(task db:api-url | sed 's#@127.0.0.1:#@host.docker.internal:#')"
        } > tmp/prod-local.env
      # backup needs object storage credentials; run it by hand when testing S06.
      - docker compose -f deploy/compose.yaml up -d --wait caddy web api
    env:
      BEDA_TAG: local
      BEDA_SITE_ADDRESS: localhost
      BEDA_TLS_INTERNAL: '1'
      BEDA_ENV_FILE: ../tmp/prod-local.env

  prod:down:
    desc: Stop the local production stack
    cmds:
      - docker compose -f deploy/compose.yaml down
    env:
      BEDA_TAG: local
      BEDA_ENV_FILE: ../tmp/prod-local.env

  shellcheck:
    desc: shellcheck the deploy scripts (local binary or the official image)
    cmds:
      - |
        if command -v shellcheck >/dev/null; then shellcheck deploy/scripts/*.sh
        else docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable deploy/scripts/*.sh; fi

  deny:
    desc: cargo-deny (licenses, advisories, bans, sources)
    cmds:
      - cargo deny check --hide-inclusion-graph

  check:
    desc: Everything CI runs (needs `supabase start` for the database checks)
    cmds:
      - task: lint
      - task: shellcheck
      - task: typecheck
      - task: test
      - task: build
      - task: deny
      - task: gen:check
      - SQLX_OFFLINE=true cargo build --release -p beda-api
