# Production stack. Only caddy publishes ports. The database is Supabase
# (amendment П-1): BEDA_DATABASE_URL in the env file points at it.
#   BEDA_TAG=<sha> docker compose -f deploy/compose.yaml up -d

name: beda

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "5"

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BEDA_SITE_ADDRESS: ${BEDA_SITE_ADDRESS:-beda.lol}
      BEDA_TLS_INTERNAL: ${BEDA_TLS_INTERNAL:-0}
      BEDA_SHARED_UPSTREAM: ${BEDA_SHARED_UPSTREAM:-shared:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    logging: *logging

  web:
    image: ghcr.io/giglabocom/beda-web:${BEDA_TAG:?set BEDA_TAG}
    restart: unless-stopped
    # Public values only (Supabase URL and publishable key): the web container
    # never sees the database or backup secrets. Without the file the site runs
    # with sign-in off (as in `task prod:up`).
    env_file:
      - path: ${BEDA_WEB_ENV_FILE:-/opt/beda/web.env}
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      BEDA_API_URL: http://api:8080
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

  api:
    image: ghcr.io/giglabocom/beda-api:${BEDA_TAG:?set BEDA_TAG}
    restart: unless-stopped
    env_file: ${BEDA_ENV_FILE:-/opt/beda/.env}
    environment:
      BEDA_HTTP_ADDR: 0.0.0.0:8080
    extra_hosts:
      # Lets `task prod:up` reach the local Supabase stack on the host.
      - host.docker.internal:host-gateway
    healthcheck:
      # Distroless has no shell or curl: the binary probes /api/readyz itself.
      test: ["CMD", "/usr/local/bin/beda-api", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *logging

  backup:
    # Nightly encrypted pg_dump of the Supabase database (supercronic, 02:15 UTC).
    image: ghcr.io/giglabocom/beda-backup:${BEDA_TAG:?set BEDA_TAG}
    restart: unless-stopped
    env_file: ${BEDA_ENV_FILE:-/opt/beda/.env}
    logging: *logging

  shared:
    # GigLabo shared-service (github.com/glani/shared-service): the region check behind the
    # cookie banner, `/api-shared/ip` in the Caddyfile. Not part of a release: it has its own
    # image and is started once by hand (deploy/SERVER-SETUP.md §4b); deploys leave it running.
    # It sends the visitor's address to ipregistry.co and keeps address → region in memory.
    profiles: [shared]
    image: ${BEDA_SHARED_IMAGE:-}
    restart: unless-stopped
    env_file:
      - path: ${BEDA_SHARED_ENV_FILE:-/opt/beda/shared.env}
        required: false
    environment:
      NODE_ENV: production
      PORT: "8080"
      LOG_LEVEL: info
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
