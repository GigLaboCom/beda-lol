name: images

# Builds the three production images. On pull requests they are only built (to
# catch Dockerfile breakage); after CI is green on main they are pushed to GHCR
# as ghcr.io/giglabocom/beda-{api,web,backup}:<sha> and :main. Tags `v*`
# additionally publish semver tags. deploy.yml picks the images up from here.

on:
  pull_request:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/giglabocom/beda
  # workflow_run runs on the default branch; build exactly the commit CI checked.
  SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: ${{ matrix.image }}
    # After CI: only a green push to main publishes.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile
          - image: backup
            dockerfile: deploy/backup/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.SHA }}
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.title=beda-${{ matrix.image }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BEDA_BUILD_SHA=${{ env.SHA }}
            BEDA_BASE_URL=${{ vars.BEDA_BASE_URL || 'https://beda.lol' }}
          # One cache per image; mode=max keeps the cargo-chef dependency layer.
          cache-from: type=gha,scope=beda-${{ matrix.image }}
          cache-to: type=gha,scope=beda-${{ matrix.image }},mode=max
          provenance: mode=max
          sbom: true
