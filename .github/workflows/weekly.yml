name: weekly

# Lighthouse against production for the key pages. Budget: performance ≥ 90
# (mobile emulation, the Lighthouse default) and accessibility ≥ 95.

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            https://beda.lol/
            https://beda.lol/osmotr
            https://beda.lol/bukvy/p-pozicionirovanie
          configPath: ./.github/lighthouserc.json
          runs: 3
          uploadArtifacts: true
